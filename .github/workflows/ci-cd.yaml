name: CI/CD Pipeline

# 1. Triggers: Run on pushes to main and on any Pull request target main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Continuous Integration (Test code)
  test:
    run-on: ubuntu-lastest

    steps: 
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: action/setup-python@v5
        with:
          python -m pip install --upgrade pip
          pip install -r requirements.text

      - name: Run automated tests with Pytest
        run : |
          pytest -v

# 2. Continuous Delivery (Build & Push Docker image)
build-and-push:
  needs: test # Crucial: Only runs if the 'test' job succeeds
  if: github.event_name == 'push' && github/ref == 'refs/heads/main'

  run-on: ubuntu-latest

  steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with: 
        username: &{{ secrets.DOCKER_USERNAME }}
        password: &{{ secrets.DOCKER_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          &{{ secret.DOCKER_USERNAME }}/my-app:latest
          &{{ secret.DOCKER_USERNAME }}/my-app{{github.sha}}

